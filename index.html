<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ATC Radar Simulator</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="container">

    <!-- ========================= -->
    <!-- Radar Display -->
    <!-- ========================= -->

    <div id="radarContainer">

        <canvas id="radar" width="900" height="900"></canvas>

        <div id="clock">
            03:00:00
        </div>

    </div>

    <!-- ========================= -->
    <!-- Control Panel -->
    <!-- ========================= -->

    <div id="controlPanel">

        <h2>ATC Control Panel</h2>

        <label>Callsign</label>
        <input
            type="text"
            id="callsign"
            placeholder="IGO201"
        >

        <label>Heading</label>
        <input
            type="number"
            id="heading"
            min="1"
            max="360"
            placeholder="090"
        >

        <br><br>

        <strong>Turn Direction</strong>

        <br><br>

        <label>
            <input
                type="radio"
                name="turnDir"
                value="SHORTEST"
                checked
            >
            Shortest
        </label>

        <br>

        <label>
            <input
                type="radio"
                name="turnDir"
                value="LEFT"
            >
            Left
        </label>

        <br>

        <label>
            <input
                type="radio"
                name="turnDir"
                value="RIGHT"
            >
            Right
        </label>

        <br><br>

        <button id="applyBtn">
            Apply Heading
        </button>

    </div>

</div>

<script src="js/radar.js"></script>
<script src="js/aircraft.js"></script>
<script src="js/main.js"></script>

</body>
</html>
